name: certus
description: "AI Govt Service Assistant - iQOO Hackathon"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.12.0
  google_mlkit_barcode_scanning: ^0.11.0
  speech_to_text: ^6.6.1
  flutter_tts: ^3.8.3
  pdf: ^3.10.7
  path_provider: ^2.1.2
  camera: ^0.10.5+9
  permission_handler: ^11.3.0
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/rulebooks/
    - assets/data/
    - assets/forms/
    - .env
